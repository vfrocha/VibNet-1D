# Configuração declarativa do instalador reproduzível do VibNet-1D (`scripts/setup/setup_config.yaml`).
#
# IMPORTANTE: A lista canônica de datasets, taxas de amostragem (`fs_hz`) e classes
# normais de referência NÃO é duplicada aqui; ela é lida dinamicamente de
# `src.vibnet.data.registry.CANONICAL_DATASETS` e `configs/datasets.yaml`.

installer_version: "1.0.0"
canonical_registry_module: "src.vibnet.data.registry"
canonical_datasets_yaml: "configs/datasets.yaml"

python:
  min_version: "3.9"
  recommended_version: "3.11"
  default_venv_dir: ".venv"

vibdata:
  custom_fork_git: "git+https://github.com/vfrocha/vibdata.git"
  pypi_fallback_package: "vibdata"

default_variants:
  - "processed_1d"
  - "raw"
  - "detrended"
  - "raw_rms"
  - "detrended_rms"

# Metadados das fontes brutas de download (mapeadas pelos datasets canônicos).
# Nota: CWRU_12k e CWRU_48k compartilham a mesma fonte bruta "CWRU".
raw_sources:
  CWRU:
    provides_datasets:
      - "CWRU_12k"
      - "CWRU_48k"
    vibdata_class: "CWRU_raw"
    archive_name: "CWRU.zip"
    expected_md5: "d7d3042161080fc82e99d78464fa2914"
    gdrive_file_id: "1G2vfms1QDlkdzqL_LAQdMIQAoludxBNj"
    direct_url: null
    auto_downloadable: true
    requires_custom_vibdata_fork: false
    estimated_raw_mb: 255
    estimated_processed_mb: 580
    license_and_notes: "Case Western Reserve University Bearing Data Center (público via espelho Google Drive da vibdata)."

