# Declarative configuration for the Classical Machine Learning Baselines
# complementary benchmark (`configs/scratch_vs_tl_classical_baselines.yaml`).
#
# Reuses the exact LOCO fold manifest from `results/scratch_vs_tl/run_20261105_141743/fold_manifest.csv`
# (66 folds x 3 seeds x 2 balance strategies = 396 fold-seed-balance blocks x 3 models = 1,188 evaluations).
#
# Hyperparameter Optimization Protocol:
#   - Strictly inside each LOCO fold's training set (`X_train_raw`, `y_train_raw`) via inner
#     StratifiedKFold (n_splits=3, shuffle=True, random_state=seed), optimizing `macro_f1`.
#   - Inside each inner CV split, `StandardScaler` and (when `balance_strategy == "smote"`) `SMOTE`
#     are fitted/applied exclusively on the inner-training partition; the inner-validation
#     partition is only scaled and never resampled.
#   - After selecting the best hyperparameter combination (`best_params`) on inner CV, the final
#     model is fitted on the outer fold's canonical training set (`X_train_bal`, `y_train_bal`)
#     and evaluated once on the held-out test condition (`X_test_scaled`).

experiment_id: "scratch_vs_tl_classical_baselines"
task: "diagnosis"
preprocessing: "detrended_rms"
feature_dimension: 25

reference_benchmark_dir: "results/scratch_vs_tl/run_20261105_141743"
reference_manifest_path: "results/scratch_vs_tl/run_20261105_141743/fold_manifest.csv"
output_root: "results/scratch_vs_tl/classical_baselines"

target_datasets:
  - "CWRU_12k"
  - "CWRU_48k"
  - "HUST_Gearbox"
  - "UOEMD"
  - "PU"

expected_loco_folds:
  CWRU_12k: 4
  CWRU_48k: 12
  HUST_Gearbox: 30
  UOEMD: 16
  PU: 4

expected_manifest_entries: 396
expected_total_evaluations: 1188

architectures:
  - "RandomForest"
  - "SVM"
  - "XGBoost"

method: "ClassicalBaseline"

balance_strategies:
  - "none"
  - "smote"

seeds:
  - 42
  - 123
  - 2026

hyperparameter_tuning:
  enabled: true
  strategy: "grid_search_stratified_kfold"
  cv_folds: 3
  scoring: "macro_f1"
  inner_scaling_and_smote_strict: true
  param_grids:
    RandomForest:
      n_estimators: [200, 500]
      max_depth: [null, 15, 30]
      min_samples_leaf: [1, 2]
      max_features: ["sqrt"]
    SVM:
      kernel: ["rbf"]
      C: [0.1, 1.0, 10.0]
      gamma: ["scale", "auto"]
    XGBoost:
      n_estimators: [200, 400]
      max_depth: [4, 6]
      learning_rate: [0.03, 0.1]
      subsample: [0.8]
      colsample_bytree: [0.8]

# Default/fixed base parameters (merged with the winning grid candidate per fold)
hyperparameters:
  RandomForest:
    n_estimators: 500
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: "sqrt"
    class_weight: null
    n_jobs: -1

  SVM:
    kernel: "rbf"
    C: 1.0
    gamma: "scale"
    probability: true
    class_weight: null

  XGBoost:
    objective: "multi:softprob"
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    min_child_weight: 1
    eval_metric: "mlogloss"
    tree_method: "hist"
    n_jobs: -1
    verbosity: 0
