# Declarative configuration for the VibNet-1D Domain Adaptation (DA),
# Domain Generalization (DG), and Transfer Learning (TL) experimental matrix
# (`configs/da_dg_tl_matrix.yaml`).

experiment_id: "da_dg_tl_matrix"
preprocessing_variant: "detrended_rms"
feature_dimension: 141
scale_invariant_ablation_dimension: 126
scale_sensitive_feature_dimension: 15
seeds:
  - 42
  - 123
  - 2026

# 1. Source configurations (UOC is explicitly excluded from this matrix)
source_configurations:
  S1:
    sources: ["UORED"]
    available_classes: ["Normal", "Ball"]
    head_output_dim: 2
    description: "UORED individually (2-class head: Normal, Ball)"
  S2:
    sources: ["HUST"]
    available_classes: ["Normal", "Ball", "Inner", "Outer", "Inner & Outer"]
    head_output_dim: 5
    description: "HUST Bearing individually (5-class head: Normal, Ball, Inner, Outer, Inner & Outer)"
  S3:
    sources: ["MFPT"]
    available_classes: ["Inner", "Outer"]
    head_output_dim: 2
    description: "MFPT individually (2-class head: Inner, Outer; Class_23 Normal used for RMS_ref)"
  S4:
    sources: ["UORED", "HUST", "MFPT"]
    available_classes: ["Normal", "Ball", "Inner", "Outer", "Inner & Outer"]
    head_output_dim: 5
    description: "UORED + HUST Bearing + MFPT combined (5-class head: all 5 harmonized classes)"

# Optional future self-supervised pretraining pool (not active in S1..S4 matrix)
optional_pretrain_only_configurations:
  S5_All7:
    enabled: false
    unsupervised_only: true
    sources: ["UORED", "HUST", "MFPT", "CWRU_12k", "CWRU_48k", "PU", "UOEMD"]
    description: "Optional future unsupervised-only TabNetPretrainer across 7 domains (disabled for S1..S4 benchmark)"

# 2. Target datasets by protocol
targets:
  DA:
    - "CWRU_12k"
    - "CWRU_48k"
    - "PU"
  DG:
    - "CWRU_12k"
    - "CWRU_48k"
    - "PU"
  TL:
    - "CWRU_12k"
    - "CWRU_48k"
    - "PU"
    - "HUST_Gearbox"
    - "UOEMD"

# 3. Harmonized bearing vocabulary & variable head output rules (Section 3)
harmonized_vocabulary:
  canonical_classes:
    0: "Normal"
    1: "Ball"
    2: "Inner"
    3: "Outer"
    4: "Inner & Outer"
  keep_compound_inner_outer_independent: true
  group_fault_severities: true
  impose_five_outputs_on_all_initial_heads: false
  dg_head_policy: "keep_exact_source_class_space_without_expansion"
  da_head_policy: "expand_for_target_classes_preserving_shared_weights_by_canonical_name"
  count_unknown_target_classes_as_error_in_dg: true
  count_absent_target_class_predictions_as_error: true

# 4. Recording-level split & normalization policies
protocols:
  DA:
    split_unit: "recording_key"
    adaptation_fraction_per_class: 0.20
    test_fraction_per_class: 0.80
    adaptation_val_fraction_within_adaptation: 0.00
    cwru_12k_normal_exception:
      total_recordings: 8
      adaptation_recordings: 2
      test_recordings: 6
      split_adaptation_into_train_val: false
    cwru_48k_normal_exception:
      calibration_mode: "external_related_domain_adaptation_normal"
      reference_domain: "CWRU_12k"
      reference_scope: "cwru_12k_adaptation_normal_recordings_only"
      forbid_cwru_12k_val_or_test_recordings: true
    rms_reference_scope: "adaptation_normal_only"
    encoder_frozen: true
    head_initialization: "expand_from_source_head_by_canonical_name"
    epoch_and_hyperparameter_selection_scope: "source_val_only"

  DG:
    split_unit: "recording_key"
    source_val_fraction: 0.20
    target_test_fraction: 1.00
    rms_reference_scope: "sources_only"
    dg_source_normalization_mode: "per_source_rms"
    same_global_rms_ref_applied_to_sources_and_target: false
    unit_conversion_before_aggregation: "1 g = 9.80665 m/s^2"
    dg_rms_aggregation_mode: "geometric_mean_ms2"
    dg_rms_formula: "RMS_global = exp(mean(log(RMS_ref_i_ms2)))"
    standard_scaler_scope: "source_train_only"
    encoder_frozen: true
    head_initialization: "trained_on_sources_only_no_expansion"
    early_stopping_scope: "source_val_only"
    zero_target_statistics_enforced: true
    feature_modes:
      - "full_141"
      - "invariant_126"
    compatible_targets_141_features:
      - "CWRU_12k"
      - "CWRU_48k"
    compatible_targets_126_scale_invariant:
      - "CWRU_12k"
      - "CWRU_48k"
      - "PU"
    blocked_targets_141_features_due_to_unit_mismatch:
      PU:
        physical_unit: "V"
        source_reference_unit: "m/s^2"
        status: "BLOCKED_INCOMPATIBLE_UNIT_VOLTS_VS_MS2"
        resolution_paths:
          - "126-feature scale-invariant ablation with dedicated 126-input TabNetPretrainer"
          - "Verified accelerometer sensitivity calibration factor (V -> m/s^2)"
    self_supervised_pretraining_scope:
      partition: "pretrain_train (source_train + pretrain_only_train)"
      include_additional_unsupervised_source_classes:
        UORED: ["Class_Cage"]
        HUST: ["Class_44", "Class_46"]
        MFPT: ["Class_23"]
      forbid_validation_recordings: true
      forbid_test_recordings: true
      forbid_target_data: true
      forbid_labels_in_pretrainer: true

  TL:
    split_unit: "operating_condition_loco"
    encoder_initialization: "TabNetPretrainer_unsupervised_on_source_config"
    modes:
      - "Scratch"
      - "Fine-Tuning"
      - "Linear Probing"
    target_head_vocabulary: "native_target_classes"
    rms_reference_scope: "target_training_conditions_only"
    cwru_48k_rms_reference_mode: "external_cwru12k_normal_reference"
    target_loco_grouping:
      CWRU_12k: "native_condition"
      CWRU_48k: "by_severity"
      PU: "native_condition"
      HUST_Gearbox: "by_speed"
      UOEMD: "native_condition"
    hust_gearbox_supported_groupings:
      - "by_speed"
      - "by_load"

# 5. Hierarchical source balancing
source_balancing:
  default_mode: "hierarchical_class_equalized"
  equalize_canonical_classes_in_multi_source: true
  equalize_dataset_contribution_within_class: true
  legacy_mode_available: "hierarchical_weights"
  apply_to_validation_or_test: false
  forbid_cross_domain_smote: true

# 6. Models, baselines and hyperparameters
models:
  primary_transfer_model: "TabNet"
  classical_baselines:
    DG:
      - "RandomForest (Source-Only)"
      - "SVM (Source-Only)"
    DA:
      - "RandomForest (Target-Only 20%)"
      - "SVM (Target-Only 20%)"
      - "RandomForest (Source + Target 20%)"
      - "SVM (Source + Target 20%)"
    TL:
      - "RandomForest (Target LOCO Train)"
      - "SVM (Target LOCO Train)"
  tabnet_hyperparameters:
    n_d: 16
    n_a: 16
    n_steps: 4
    gamma: 1.3
    n_independent: 2
    n_shared: 2
    mask_type: "sparsemax"
    pretrain_epochs: 30
    head_max_epochs: 40
    head_patience: 10
    batch_size: 64
    lr_pretrain: 0.02
    lr_head_source: 0.01
    lr_head_da: 0.005
    lr_tl_finetune: 0.01

output_root: "results/da_dg_tl_matrix"
